name: Monthly contributions chart

on:
  schedule:
    - cron: "17 3 * * *" # her gün 06:17 (Türkiye saati)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Grafiği üret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I aylik_grafik.py karatarkan assets
      - name: Değiştiyse commit'le
        run: |
          git add assets/aylik-katki-koyu.svg assets/aylik-katki-acik.svg
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update monthly contributions chart"
          git push
